name: linux-ci

# Cost policy: the full suite runs only for pull requests into main and for
# merges to main. Development branches are checked locally, which keeps the free
# Actions minutes for release-gating runs. Use workflow_dispatch for a one-off
# full run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; push runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether the expensive runtime suite is relevant. quick-checks stays
  # repository-wide; only the jobs whose inputs did not change are skipped.
  # Skipping a job (not the whole workflow) keeps required checks reportable.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          echo "runtime=$(sh scripts/ci-runtime-paths.sh "$base" "$head" "$EVENT_NAME")" >> "$GITHUB_OUTPUT"
          echo "docs_only=$(sh scripts/ci-runtime-paths.sh "$base" "$head" "$EVENT_NAME" docs-only)" >> "$GITHUB_OUTPUT"

  quick-checks:
    needs: changes
    # Fail open: a failed decision job leaves the outputs empty, so the code
    # checks below still run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: adapter/package-lock.json

      - name: Prepare private temporary directory
        run: bash scripts/ci-private-tmpdir.sh

      - name: Offline setup regressions (mocks only)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          bash infra/repro/test_bootstrap_package_status.sh
          bash infra/repro/test_bootstrap_userns_optin.sh

      - name: Hyper-V Netplan injector regression
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          command -v netplan >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq netplan.io; }
          python3 infra/repro/test_hyperv_netplan_injection.py -v

      - name: Guest provisioning helper regressions
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: python3 -m unittest discover -s infra/guest -p 'test_*.py' -v

      - name: Cgroup teardown witness regressions
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: python3 -m unittest discover -s infra/repro -p 'test_cgroup_teardown_witness.py' -v

      - name: Official Pi runtime closure regressions
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: python3 -m unittest discover -s scripts -p 'test_prepare_official_pi_runtime.py' -v

      - name: Go test timing summary regressions
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: python3 -m unittest discover -s scripts -p 'test_ci_go_test_timing.py' -v

      - name: Corpus sampling (D48) regressions
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: python3 -m unittest discover -s corpus/sampling -p 'test_*.py' -v

      - name: Offline package and publisher regressions
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          umask 077
          bash tests/packaging/verify-package-manager-layout.sh
          bash tests/packaging/verify-publish-release-assets.sh
          bash tests/packaging/verify-release-verify-lib.sh

      - name: Release workflow coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: bash tests/packaging/verify-release-workflow-coverage.sh 1.2.3

      - name: Runtime path filter regressions
        run: bash tests/ci/test-runtime-paths.sh

      - name: Runtime status workflow regressions
        run: bash tests/ci/test-runtime-status.sh

      - name: Documentation links
        run: python3 scripts/check-doc-links.py

      - name: Governed container pins
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: bash tests/packaging/verify-governed-containerfile-pins.sh

      - name: Workflow lint
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -no-color -shellcheck= -pyflakes=

      - name: gofmt
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: supervisor
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: supervisor
        run: umask 077; go vet -mod=readonly ./...

      - name: Adapter checks
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: adapter
        run: |
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  # One matrix runs the Go suites, so setup is written once. The race suite is split into shards
  # (scripts/ci-race-shard.sh) so no single leg takes the whole sweep. fail-fast is off: a failed leg
  # does not stop the others from reporting. The runtime job below reports the combined result.
  runtime-tests:
    needs: changes
    # Fail open: if the decision job fails, run the suite instead of leaving a
    # required check skipped.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    name: runtime (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: unit, label: unit }
          - { suite: race, label: race-product, shard: product }
          - { suite: race, label: race-cmd, shard: cmd }
          - { suite: race, label: race-rest, shard: rest }
    env:
      TBOUND_REQUIRE_PI_CLI_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: adapter/package-lock.json

      - name: Prepare private temporary directory
        run: |
          bash scripts/ci-private-tmpdir.sh
          printf 'TBOUND_PI_CLI_BIN=%s/tbound-pi-cli/bin/pi\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install and verify official Pi CLI
        run: |
          umask 077
          install -d -m 700 "$RUNNER_TEMP/tbound-pi-cli"
          npm_config_prefix="$RUNNER_TEMP/tbound-pi-cli" npm install --global \
            --ignore-scripts --no-audit --no-fund \
            @earendil-works/pi-coding-agent@0.87.1
          test -x "$TBOUND_PI_CLI_BIN"
          pi_version="$("$TBOUND_PI_CLI_BIN" --version)"
          test "$pi_version" = "0.87.1"

      - name: Prepare hosted namespace test prerequisites
        working-directory: supervisor
        run: |
          set -euo pipefail
          umask 077
          uname -r
          if test -r /proc/self/attr/current; then
            cat /proc/self/attr/current
          fi
          # Boot-only setting on this disposable runner; no persistent host policy.
          # https://documentation.ubuntu.com/release-notes/24.04/
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            printf 'AppArmor user namespace restriction: %s\n' "$restriction"
            if test "$restriction" = 1; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          if ! go test -mod=readonly -count=1 -v ./internal/sandbox -run '^TestProbeMechanisms$'; then
            sudo dmesg | grep -E 'apparmor=.*DENIED|userns' | tail -20 || true
            exit 1
          fi

      # go test -json goes to the private TMPDIR. Only the sanitized timing document is uploaded.
      - name: Go unit suite
        id: go-unit-suite
        if: ${{ matrix.suite == 'unit' }}
        working-directory: supervisor
        run: |
          set -euo pipefail
          umask 077
          go test -mod=readonly -count=1 -json ./... > "$TMPDIR/go-test-unit.jsonl"

      # Reports only: the step above decides pass or fail, and this step runs even when it fails.
      - name: Go unit suite timing
        continue-on-error: true
        if: ${{ matrix.suite == 'unit' && always() && steps.go-unit-suite.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci_go_test_timing.py --suite unit \
            --go-test-json "$TMPDIR/go-test-unit.jsonl" \
            --timing-json "$RUNNER_TEMP/go-test-timing/unit.json" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Go unit suite timing
        continue-on-error: true
        if: ${{ matrix.suite == 'unit' && always() && steps.go-unit-suite.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-unit-suite-timing-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-timing/unit.json
          retention-days: 14

      # The real-cgroup test skips in the unit suite above: a hosted runner is not root and its service
      # cgroup is not delegated to it. Run it once in a cgroup delegated to the runner user, and fail if it
      # skips, so the fresh-cgroup run is verified on this runner and not silently dropped.
      - name: Real cgroup test in a delegated cgroup
        if: ${{ matrix.suite == 'unit' }}
        working-directory: supervisor
        run: |
          set -euo pipefail
          umask 077
          sudo systemd-run --pipe --wait --collect --quiet \
            -p User="$(id -un)" -p Delegate=yes -p TasksMax=512 -p MemoryMax=2G \
            --working-directory="$PWD" \
            --setenv=PATH="$PATH" --setenv=HOME="$HOME" --setenv=TMPDIR="$TMPDIR" \
            --setenv=GOCACHE="$(go env GOCACHE)" --setenv=GOMODCACHE="$(go env GOMODCACHE)" \
            "$(command -v go)" test -mod=readonly -count=1 -v ./cmd/tbound-profile \
            -run '^TestRunGuestTestsRunsTheRealCgroupTestsInAFreshCgroupAndRemovesIt$' | tee "$RUNNER_TEMP/real-cgroup.txt"
          grep -q -- '^--- PASS: TestRunGuestTestsRunsTheRealCgroupTestsInAFreshCgroupAndRemovesIt ' "$RUNNER_TEMP/real-cgroup.txt"

      # Verbose, and fail if this runner's kernel skips the real enforcement tests.
      - name: Landlock enforcement on this runner's kernel
        if: ${{ matrix.suite == 'unit' }}
        working-directory: supervisor
        run: |
          set -euo pipefail
          umask 077
          go test -mod=readonly -count=1 -v ./cmd/tbound-cell-entrypoint -run '^TestLandlock' | tee "$RUNNER_TEMP/landlock.txt"
          grep -q -- '^--- PASS: TestLandlockTSYNCReachesEnforcement ' "$RUNNER_TEMP/landlock.txt"
          grep -q -- '^--- PASS: TestLandlockConnectRightIsPort8080OnlyAndOnlyForNetSink ' "$RUNNER_TEMP/landlock.txt"

      - name: Go race suite
        id: go-race-suite
        if: ${{ matrix.suite == 'race' }}
        working-directory: supervisor
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          umask 077
          sh ../scripts/ci-race-shard.sh "$SHARD" > "$TMPDIR/go-test-race.jsonl"

      - name: Go race suite timing
        continue-on-error: true
        if: ${{ matrix.suite == 'race' && always() && steps.go-race-suite.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci_go_test_timing.py --suite race \
            --go-test-json "$TMPDIR/go-test-race.jsonl" \
            --timing-json "$RUNNER_TEMP/go-test-timing/race.json" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Go race suite timing
        continue-on-error: true
        if: ${{ matrix.suite == 'race' && always() && steps.go-race-suite.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-race-suite-timing-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-timing/race.json
          retention-days: 14

      - name: Install adapter dependencies for the Pi fixture
        if: ${{ matrix.suite == 'unit' }}
        working-directory: adapter
        run: |
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund

      # quick-checks has no Pi CLI, so its adapter run skips this test. It must run, and not skip, here.
      - name: Official Pi CLI adapter integration
        if: ${{ matrix.suite == 'unit' }}
        working-directory: adapter
        run: |
          set -o pipefail
          umask 077
          node --experimental-strip-types --test --test-reporter=spec src/tbound-cli-extension.test.ts | tee "$TMPDIR/pi-adapter-integration.txt"
          grep -q 'ℹ skipped 0' "$TMPDIR/pi-adapter-integration.txt"

      - name: Offline official Pi CLI development fixture (non-claim-bearing)
        if: ${{ matrix.suite == 'unit' }}
        working-directory: supervisor
        run: |
          set -euo pipefail
          umask 077
          fixture_bin="$RUNNER_TEMP/tbound-dev-fixture"
          fixture_root="$RUNNER_TEMP/tbound-dev-fixture-root"
          fixture_home="$RUNNER_TEMP/tbound-dev-fixture-home"
          receipt="$RUNNER_TEMP/tbound-dev-fixture.json"
          node_bin="$(command -v node)"
          install -d -m 700 "$fixture_root" "$fixture_home"
          go build -mod=readonly -o "$fixture_bin" ./cmd/tbound
          env -i \
            PATH="$PATH" \
            HOME="$fixture_home" \
            TMPDIR="$TMPDIR" \
            LANG=C.UTF-8 \
            TBOUND_DEV_FIXTURE_PI="$TBOUND_PI_CLI_BIN" \
            TBOUND_DEV_FIXTURE_NODE="$node_bin" \
            TBOUND_DEV_FIXTURE_ADAPTER="$GITHUB_WORKSPACE/adapter" \
            TBOUND_DEV_FIXTURE_ROOT="$fixture_root" \
            "$fixture_bin" serve --pi --dev-fixture > "$receipt"
          python3 - "$receipt" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              receipt = json.load(stream)

          assert receipt["mode"] == "dev-fixture", receipt
          assert receipt["worker_ready"] is True, receipt
          assert receipt["prompt_admitted"] is True, receipt
          assert receipt["turn_completed"] is True, receipt
          assert receipt["provider_turns"] == 5, receipt
          assert receipt["proposal_count"] == 4, receipt
          assert receipt["tool_call_count"] == 4, receipt
          assert receipt["tool_result_count"] == 4, receipt
          assert receipt["initial_generation"] == "g0", receipt
          assert receipt["generations"] == ["g0", "g1", "g2"], receipt
          assert receipt["final_generation"] == "g2", receipt
          lineage = [(item["tool"], item["generation_from"], item["generation_to"])
                     for item in receipt["tool_lineage"]]
          assert lineage == [
              ("read", "g0", "g0"),
              ("edit", "g0", "g1"),
              ("bash", "g1", "g2"),
              ("read", "g2", "g2"),
          ], receipt
          assert receipt["claim_bearing"] is False, receipt
          assert receipt["provider_exchange"] is False, receipt
          assert receipt["containment"] == "not-established", receipt
          assert receipt["publication"] == "not-attempted", receipt
          assert receipt["settlement"] == "UNKNOWN", receipt
          print("PASS: offline Pi CLI fixture completed; non-claim-bearing, settlement UNKNOWN")
          PY

  # Stable required check; the name is unchanged. Passes when runtime-tests succeeded, or when the
  # decision job succeeded and skipped runtime-tests with an output of exactly "false". Every other
  # result fails: failures, cancellations and unexpected skips.
  runtime:
    needs: [changes, runtime-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Decide runtime status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_RUNTIME: ${{ needs.changes.outputs.runtime }}
          RUNTIME_TESTS_RESULT: ${{ needs.runtime-tests.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT runtime=$CHANGES_RUNTIME runtime-tests=$RUNTIME_TESTS_RESULT"
          if [ "$RUNTIME_TESTS_RESULT" = success ]; then
            exit 0
          fi
          if [ "$RUNTIME_TESTS_RESULT" = skipped ] && [ "$CHANGES_RESULT" = success ] && [ "$CHANGES_RUNTIME" = false ]; then
            echo "No runtime-relevant change: the runtime suites were skipped by the decision."
            exit 0
          fi
          echo "::error::The runtime suites did not pass, and no clean no-change decision skipped them."
          exit 1
