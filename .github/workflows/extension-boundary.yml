name: extension-boundary

# Unfiltered on purpose: a core change that imports the optional extension must
# fail on any push or pull request. Pure sh and grep; no Go, no Node.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs; push runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Core/extension boundary guard
        run: sh scripts/check-extension-boundary.sh

      - name: Boundary guard self-test
        run: sh scripts/check-extension-boundary.sh --self-test

      - name: Self-contained workspace guard
        run: bash scripts/check-self-contained.sh --self-test
