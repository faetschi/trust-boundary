name: extension-boundary

# A core change that imports the optional extension must fail before it reaches
# main. Pure sh and grep; no Go, no Node. Limited to main under the same cost
# policy as linux-ci (see ci.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; push runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Core/extension boundary guard
        run: sh scripts/check-extension-boundary.sh

      - name: Boundary guard self-test
        run: sh scripts/check-extension-boundary.sh --self-test

      - name: Self-contained workspace guard
        run: bash scripts/check-self-contained.sh --self-test
