name: webchat-extension

# Optional extension only. Path-filtered so core-only changes never run it, and
# no core job depends on it (see extensions/webchat/README.md).
#
# Action references are pinned to full commit SHAs; the release tag is in a
# comment. Node is read from extensions/webchat/frontend/.nvmrc in every job, so
# the Go job and the frontend job cannot drift apart.
on:
  workflow_dispatch:
  # Feature branches run through pull_request; merged trees are checked on push.
  push:
    branches: [main, codex/tbound-prototype]
    paths:
      - "extensions/webchat/**"
      - "supervisor/internal/productprotocol/testdata/**"
      - ".github/workflows/webchat-extension.yml"
  pull_request:
    paths:
      - "extensions/webchat/**"
      - "supervisor/internal/productprotocol/testdata/**"
      - ".github/workflows/webchat-extension.yml"

permissions:
  contents: read

# Cancel superseded PR runs; push runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webchat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/webchat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: extensions/webchat/frontend/.nvmrc

      - name: Prepare private temporary directory
        run: |
          umask 077
          TMPDIR="$(mktemp -d "$HOME/tw-ci.XXXXXXXX")"
          chmod 700 "$TMPDIR"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          umask 077
          test -z "$(gofmt -l .)"

      - name: Go vet
        run: umask 077; go vet -mod=readonly ./...

      - name: Go race suite
        run: umask 077; go test -race -mod=readonly -count=1 ./...

  # React frontend (extensions/webchat/frontend). Installs run without install
  # scripts. The build is committed, so the job also proves it is reproducible.
  # repro runs before verify: it compares two clean rebuilds with the dist/
  # committed at HEAD, and nothing has rebuilt the tree when it starts.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/webchat/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: extensions/webchat/frontend/.nvmrc
          cache: npm
          cache-dependency-path: extensions/webchat/frontend/package-lock.json

      - name: Prepare private temporary directory
        run: |
          umask 077
          TMPDIR="$(mktemp -d "$HOME/tw-ci.XXXXXXXX")"
          chmod 700 "$TMPDIR"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"

      - name: Install without install scripts
        run: umask 077; npm ci --ignore-scripts

      - name: Reproducibility before any build (two clean builds, compared with the dist/ committed at HEAD)
        run: umask 077; npm run repro

      - name: Verify (typecheck, tests, sink and dependency gates; no rebuild)
        run: umask 077; npm run verify:no-build

      - name: Committed dist/ matches the working tree after verify
        working-directory: ${{ github.workspace }}
        run: |
          changes="$(git status --porcelain --untracked-files=all -- extensions/webchat/internal/webchat/dist)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "dist/ differs from the committed build: rebuild and commit it" >&2
            exit 1
          fi

  # Manual only (workflow_dispatch). Opt-in browser CSP smoke against a demo
  # gateway on a fresh port (never 8791). No gate depends on it.
  csp-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/webchat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: extensions/webchat/frontend/.nvmrc

      - name: Build and start the demo gateway
        run: |
          umask 077
          go build -mod=readonly -o "$RUNNER_TEMP/tbound-webchat" ./cmd/tbound-webchat
          "$RUNNER_TEMP/tbound-webchat" --demo --addr 127.0.0.1:18791 > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18791/api/v1/contract > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/gateway.log"
          exit 1

      - name: CSP smoke (system Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/csp-smoke.mjs --url http://127.0.0.1:18791
