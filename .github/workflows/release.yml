name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (semver); empty uses 0.0.0 on branches"
        required: false
        default: ""

permissions:
  contents: read

# Do not cancel a release in progress; queue one run per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.0.0}"
          fi
          case "$version" in
            *[!A-Za-z0-9._-]*|"") echo "release: invalid version '$version'" >&2; exit 1 ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Require the tag on a released branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main && \
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/codex/tbound-prototype; then
            echo "release: tag $GITHUB_REF_NAME is not on main or codex/tbound-prototype" >&2
            exit 1
          fi

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build-release.sh "$VERSION" dist \
            linux/amd64 darwin/amd64 darwin/arm64 windows/amd64

      - name: Generate npm packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/make-npm-packages.sh "$VERSION" dist

      - name: Verify the install flow (offline)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TBOUND_VERIFY_DIST: dist
        run: bash scripts/verify-install.sh "$VERSION"

      - name: Verify Linux packaging strict-mode failure behavior
        run: |
          TMPDIR="$(mktemp -d "${RUNNER_TEMP}/tbound-strict-mode.XXXXXX")"
          chmod 700 "$TMPDIR"
          export TMPDIR
          trap 'rm -rf "$TMPDIR"' EXIT
          bash tests/packaging/verify-release-strict-mode.sh

      - name: Strict packaging acceptance (Linux/amd64 required)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TBOUND_REQUIRE_LINUX_RELEASE: "1"
          TBOUND_RELEASE_DIST: dist
        run: |
          TMPDIR="$(mktemp -d "${RUNNER_TEMP}/tbound-release-acceptance.XXXXXX")"
          chmod 700 "$TMPDIR"
          export TMPDIR
          trap 'rm -rf "$TMPDIR"' EXIT
          bash tests/packaging/verify-release-layout.sh "$VERSION" --require-linux

      - name: Verify npm packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TBOUND_NPM_DIST: dist
        run: |
          TMPDIR="$(mktemp -d "${RUNNER_TEMP}/tbound-npm-verify.XXXXXX")"
          chmod 700 "$TMPDIR"
          export TMPDIR
          trap 'rm -rf "$TMPDIR"' EXIT
          bash tests/packaging/verify-npm-packages.sh "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tbound-dist
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/tbound-cell-entrypoint-*-linux-amd64.metadata.json
            dist/tbound-cell-entrypoint-*-linux-amd64.sha256
            dist/npm/**

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tbound-dist
          path: dist

      - name: Verify downloaded artifacts
        run: |
          cd dist
          sha256sum --quiet -c SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/tbound-cell-entrypoint-*-linux-amd64.metadata.json
            dist/tbound-cell-entrypoint-*-linux-amd64.sha256

      # npm publishing is intentionally manual/opt-in. After a tag build:
      #   for d in dist/npm/*/; do (cd "$d" && npm publish --access public); done
