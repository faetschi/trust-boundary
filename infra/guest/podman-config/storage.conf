# Managed Pi service Podman storage profile. Pinned by digest in serve-pi-service.json.
[storage]
driver = "overlay"
runroot = "/run/tbound-pi/podman-runroot"
graphroot = "/var/lib/tbound/podman-storage/graphroot"
rootless_storage_path = "/var/lib/tbound/podman-storage/graphroot"

[storage.options]
ignore_chown_errors = "true"
