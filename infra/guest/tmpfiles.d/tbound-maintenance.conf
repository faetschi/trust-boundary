# Canonical source for /etc/tmpfiles.d/tbound-maintenance.conf (root:root 0644).
# The maintenance lock that tbound trial reset (root) and the Pi service share (flock), see
# PROVISIONING-SIGNING.md R5-5. /run/tbound is made by tbound-pi.socket (DirectoryMode=0755); the
# service sees /run read only and only opens the file. The file must be root-owned and not writable
# by group or others, or the service refuses every admission.
d /run/tbound 0755 root root -
f /run/tbound/maintenance.lock 0644 root root -
